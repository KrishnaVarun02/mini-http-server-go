name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Unit and TCP integration tests
        run: go test -race -count=1 ./...
      - name: Deterministic demonstration
        run: go run ./cmd/demo
      - name: Build application
        run: go build ./cmd/httpserver
